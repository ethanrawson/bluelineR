# R CMD check (r-lib/actions). Linux always; macOS and Windows only while the
# repository is public, where Actions minutes are free (on a private one they
# bill at 10x and 2x).
on:
  push:
    branches: [Model, main]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  linux:
    runs-on: ubuntu-latest
    name: ubuntu-latest (${{ matrix.r }})
    strategy:
      fail-fast: false
      matrix:
        r: ['devel', 'release', 'oldrel-1']
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          http-user-agent: ${{ matrix.r == 'devel' && 'release' || '' }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  macos-windows:
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (release)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
