url: https://ethanrawson.github.io/bluelineR/
template:
  bootstrap: 5
  # Dark, like BluelineMetrics.
  theme: a11y-dark
  bslib:
    bg: "#0b1220"
    fg: "#f1f5f9"
    primary: "#4c8dff"
    body-secondary-color: "#f1f5f9"
    code-bg: "#111a2e"
    code-color: "#facc15"
    navbar-bg: "#070d18"
    border-color: "#26324a"
    base_font: {google: "Manrope"}
    heading_font: {google: "Barlow Condensed"}
navbar:
  type: dark
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
reference:
- title: Games
  contents: [nhl_scores, nhl_schedule, nhl_team_schedule, nhl_standings, nhl_pbp, nhl_boxscore, nhl_game, nhl_shifts]
- title: Goal tracking
  contents: [nhl_goal_tracking, read_goal_tracking, goal_frame, classify_goal, goal_context, skater_speed]
- title: Game tracking summaries
  contents: [nhl_tracking_summary]
- title: NHL EDGE
  contents: [nhl_edge, nhl_edge_leaders, nhl_edge_by_the_numbers]
- title: Players and clubs
  contents: [nhl_player, nhl_roster, nhl_team_stats, nhl_stat_leaders, nhl_headshot_url, nhl_team_info]
- title: Draft
  contents: [nhl_draft_rankings, nhl_draft_lottery]
- title: Contracts, trades and transactions
  contents: [nhl_signings, espn_transactions]
- title: Coaches and GMs
  contents: [nhl_coaches]
- title: International
  contents: [nhl_international]
- title: IIHF tournaments
  contents: [iihf]
- title: Odds and props
  contents: [espn_odds, devig, espn_player_splits]
- title: More from the NHL
  contents: [nhl_player_bio, nhl_team_comparison, nhl_broadcasts, nhl_quick_stats, nhl_news, nhl_playoff_series]
- title: Stats and records APIs
  contents: [nhl_stats, nhl_stat_eras, nhl_era_adjust, nhl_league_env, nhl_teams, nhl_records, nhl_records_catalog, nhl_franchise_records, nhl_milestones]
- title: Plots
  contents: [nhl_rink, plot_goal, plot_shots, animate_goal]
- title: Helpers
  contents: [nhl_api, tidy_json, nhl_season, nhl_cache_clear, bluelineR-options]
articles:
- title: Articles
  contents: [bluelineR, goal-tracking, articles/beyond-the-nhl]
